<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: fit the device width, allow the visualViewport tricks the
         symbol toolbar relies on, and cover the notch area on phones. -->
    <!-- interactive-widget=resizes-content shrinks the layout when the on-screen
         keyboard opens, so our bottom symbol toolbar stays visible above it without
         any visualViewport JavaScript. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Mobile-first Python practice with auto-graded challenges." />
    <title>PyPocket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
