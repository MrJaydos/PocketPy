# Coolify deployment via Docker Compose.
#
# In Coolify, create the app with Build Pack = "Docker Compose" and point it at this
# file. Coolify builds the image from the Dockerfile (see `build:` below), injects the
# environment variables, provisions the named volume, and wires the domain to the
# service through its proxy.
#
# Coolify conventions used here:
#   ${APP_PASSWORD:?...}          -> a REQUIRED variable; deployment fails until you
#                                    set it in the Coolify UI.
#   ${SERVICE_PASSWORD_64_...}    -> Coolify auto-generates a stable 64-char secret,
#                                    so you don't have to invent a SESSION_SECRET.
#   SERVICE_FQDN_PYPOCKET_3000    -> tells Coolify to route the assigned domain to
#                                    this service's port 3000 (its internal proxy).
#
# For local testing you can't use the Coolify magic vars; run the app directly with
# `npm run dev:server` + `npm run dev:client` instead (see README).

services:
  pypocket:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000

      # Coolify assigns a domain and proxies it to port 3000. The value "/" serves
      # the app at the domain root. Your Cloudflare tunnel points at this domain.
      SERVICE_FQDN_PYPOCKET_3000: /

      # The single login password. REQUIRED — set it in Coolify's Environment tab.
      APP_PASSWORD: ${APP_PASSWORD:?set a login password in the Coolify UI}

      # Session cookie signing secret. Coolify generates a stable random value the
      # first time and keeps it across redeploys; you can override it in the UI.
      SESSION_SECRET: ${SERVICE_PASSWORD_64_PYPOCKET}

      # SQLite lives on the persistent volume mounted below.
      DB_PATH: /data/app.db

      # IANA timezone used to bucket solves into days for the streak.
      APP_TZ: ${APP_TZ:-UTC}

    # Expose (not publish) the port so Coolify's proxy handles external access.
    expose:
      - '3000'

    # `default` keeps the app on the stack network Coolify's proxy routes to (so the
    # domain/tunnel keeps working); `runner_net` is the private, no-egress network it
    # shares with the runner so it can reach http://runner:8000. If the site ever
    # stops resolving after this change, removing this `networks:` block reverts it.
    networks:
      - default
      - runner_net

    volumes:
      # Named volume — Coolify persists it across deploys, keeping your progress.
      - pypocket-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    restart: unless-stopped

  # --- Phase 2: sandboxed server-side runner -----------------------------------
  # Executes challenges flagged `runner: "server"` in throwaway subprocesses. It is
  # NOT exposed (no ports, no SERVICE_FQDN), and sits on an `internal` network with
  # no internet egress, so untrusted code can't phone home or be reached via the
  # tunnel. Hardened: non-root, read-only rootfs (+ tmpfs /tmp), memory/CPU/pids
  # caps, all capabilities dropped, no privilege escalation. The app reaches it by
  # service name on the shared `runner_net` below.
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    networks:
      - runner_net
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RUN_TIMEOUT_SECONDS: '10'
    restart: unless-stopped

volumes:
  pypocket-data:

networks:
  # internal: true => this network has no route to the internet. The runner is only
  # on this network, so code running inside it cannot make outbound connections.
  runner_net:
    internal: true
