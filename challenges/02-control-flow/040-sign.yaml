id: control-flow-sign
title: Sign of a Number
topic: control-flow
tags: [conditionals]
difficulty: 1
order: 40
runner: pyodide
description: |
  ## Three-way branching

  Write a function `sign(n)` that returns:

  - `1` if `n` is positive
  - `-1` if `n` is negative
  - `0` if `n` is zero
starter_code: |
  def sign(n):
      # Return 1, -1, or 0 depending on n.
      pass
tests: |
  check(sign(5) == 1, "positive -> 1")
  check(sign(-3) == -1, "negative -> -1")
  check(sign(0) == 0, "zero -> 0")
hints:
  - Use `if`, `elif`, and `else` to cover the three cases.
  - '`n > 0` is positive; `n < 0` is negative; otherwise it must be 0.'
solution: |
  def sign(n):
      if n > 0:
          return 1
      elif n < 0:
          return -1
      else:
          return 0
