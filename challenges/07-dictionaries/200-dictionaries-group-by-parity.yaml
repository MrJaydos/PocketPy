id: dictionaries-group-by-parity
title: Group by Parity
topic: dictionaries
tags:
  - dictionaries
  - lists
difficulty: 3
order: 200
runner: pyodide
description: |
  ## Evens and odds

  Write a function `group_by_parity(nums)` that returns a dictionary with keys
  `"even"` and `"odd"`, each mapping to a list of the numbers of that kind, in
  their original order.

  For example, `group_by_parity([1, 2, 3, 4])` returns
  `{"even": [2, 4], "odd": [1, 3]}`.
starter_code: |
  def group_by_parity(nums):
      pass
tests: |
  check(group_by_parity([1, 2, 3, 4]) == {"even": [2, 4], "odd": [1, 3]}, "splits them")
  check(group_by_parity([]) == {"even": [], "odd": []}, "empty input")
  check(group_by_parity([2]) == {"even": [2], "odd": []}, "one even")
hints:
  - Start with both lists empty inside the dictionary.
  - Append each number to the right list based on `n % 2`.
solution: |
  def group_by_parity(nums):
      result = {"even": [], "odd": []}
      for n in nums:
          if n % 2 == 0:
              result["even"].append(n)
          else:
              result["odd"].append(n)
      return result
