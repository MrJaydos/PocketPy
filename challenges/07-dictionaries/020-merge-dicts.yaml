id: dictionaries-merge
title: Merge Two Dictionaries
topic: dictionaries
tags: [dictionaries]
difficulty: 2
order: 20
runner: pyodide
description: |
  ## Combining dictionaries

  Write a function `merge(a, b)` that returns a new dictionary containing all the
  entries from both `a` and `b`. If the same key appears in both, the value from
  `b` wins. Neither input should be modified.

  For example, `merge({"x": 1}, {"y": 2})` returns `{"x": 1, "y": 2}`.
starter_code: |
  def merge(a, b):
      # Return a new dict with entries from both; b wins on conflicts.
      pass
tests: |
  check(merge({"x": 1}, {"y": 2}) == {"x": 1, "y": 2}, "combines keys")
  check(merge({"x": 1}, {"x": 9}) == {"x": 9}, "b wins on a shared key")
  check(merge({}, {"a": 1}) == {"a": 1}, "empty first dict")
  a = {"x": 1}
  merge(a, {"x": 9})
  check(a == {"x": 1}, "the original dict a is not modified")
hints:
  - Start by making a copy of `a` with `dict(a)` so you don't change the original.
  - Then add everything from `b` — `result.update(b)` overwrites shared keys.
solution: |
  def merge(a, b):
      result = dict(a)
      result.update(b)
      return result
