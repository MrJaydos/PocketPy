id: strings-mask
title: Mask a Secret
topic: strings
tags:
  - strings
difficulty: 3
order: 180
runner: pyodide
description: |
  ## Hide all but the last four

  Write a function `mask(s)` that replaces every character except the last four
  with `"*"`. If the string is four characters or fewer, return it unchanged.

  For example, `mask("1234567890")` returns `"******7890"`.
starter_code: |
  def mask(s):
      pass
tests: |
  check(mask("1234567890") == "******7890", "long string")
  check(mask("1234") == "1234", "exactly four")
  check(mask("12345") == "*2345", "five characters")
hints:
  - If `len(s) <= 4`, return it as-is.
  - Otherwise build `"*" * (len(s) - 4)` and add the last four (`s[-4:]`).
solution: |
  def mask(s):
      if len(s) <= 4:
          return s
      return "*" * (len(s) - 4) + s[-4:]
