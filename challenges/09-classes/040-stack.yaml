description: |
  ## Building a data structure

  A stack is "last in, first out". Write a class `Stack` that starts empty and
  supports:

  - `.push(item)` adds an item on top
  - `.pop()` removes and returns the top item
  - `.peek()` returns the top item without removing it
  - `.is_empty()` returns `True` when there are no items

  ```python
  s = Stack()
  s.push(1)
  s.push(2)
  s.pop()      # -> 2
  s.peek()     # -> 1
  ```
