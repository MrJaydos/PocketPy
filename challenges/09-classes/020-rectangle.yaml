description: |
  ## Methods that compute

  Write a class `Rectangle` that is created with a width and a height, and has
  two methods:

  - `.area()` returns width times height
  - `.perimeter()` returns twice the sum of width and height

  For example:

  ```python
  r = Rectangle(3, 4)
  r.area()       # -> 12
  r.perimeter()  # -> 14
  ```
starter_code: |
  class Rectangle:
      def __init__(self, width, height):
          # Store the width and height.
          pass

      def area(self):
          pass

      def perimeter(self):
          pass
tests: |
  r = Rectangle(3, 4)
  check(r.area() == 12, "3 x 4 area is 12")
  check(r.perimeter() == 14, "perimeter is 2*(3+4) = 14")
  s = Rectangle(5, 5)
  check(s.area() == 25, "square area")
  check(s.perimeter() == 20, "square perimeter")
hints:
  - 'Save the sides in `__init__` as `self.width` and `self.height`.'
  - The methods use those attributes, e.g. `return self.width * self.height`.
solution: |
  class Rectangle:
      def __init__(self, width, height):
          self.width = width
          self.height = height

      def area(self):
          return self.width * self.height

      def perimeter(self):
          return 2 * (self.width + self.height)
