description: |
  ## First in, first out

  Write a class `Queue` with `enqueue(x)` to add an item at the back, `dequeue()`
  to remove and return the item at the front, and `size()` for how many items
  remain.

  For example, after enqueuing 1 then 2, `dequeue()` returns `1`.
starter_code: |
  class Queue:
      def __init__(self):
          pass

      def enqueue(self, x):
          pass

      def dequeue(self):
          pass

      def size(self):
          pass
tests: |
  q = Queue()
  q.enqueue(1)
  q.enqueue(2)
  check(q.dequeue() == 1, "first in comes out first")
  check(q.size() == 1, "one left")
  check(q.dequeue() == 2, "then the second")
  check(q.size() == 0, "empty again")
hints:
  - Back the queue with a list.
  - "`enqueue` appends; `dequeue` uses `.pop(0)` to take from the front."
solution: |
  class Queue:
      def __init__(self):
          self.items = []

      def enqueue(self, x):
          self.items.append(x)

      def dequeue(self):
          return self.items.pop(0)

      def size(self):
          return len(self.items)
