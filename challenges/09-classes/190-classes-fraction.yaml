description: |
  ## Fractions in lowest terms

  Write a class `Fraction` whose constructor takes a numerator and denominator and
  stores them **in lowest terms** (divide both by their greatest common divisor).
  Add `as_tuple()` returning `(num, den)` and `add(other)` returning a new
  `Fraction` for the sum.

  For example, `Fraction(2, 4).as_tuple()` returns `(1, 2)`.
starter_code: |
  class Fraction:
      def __init__(self, num, den):
          pass

      def as_tuple(self):
          pass

      def add(self, other):
          pass
tests: |
  check(Fraction(2, 4).as_tuple() == (1, 2), "reduced on creation")
  check(Fraction(3, 3).as_tuple() == (1, 1), "reduces to one")
  half = Fraction(1, 2)
  third = Fraction(1, 3)
  check(half.add(third).as_tuple() == (5, 6), "one half plus one third")
hints:
  - Write a small gcd helper and divide both parts by it in the constructor.
  - To add fractions, use `a/b + c/d = (a*d + c*b) / (b*d)`, then let the constructor reduce it.
solution: |
  def _gcd(a, b):
      while b:
          a, b = b, a % b
      return a

  class Fraction:
      def __init__(self, num, den):
          g = _gcd(abs(num), abs(den)) or 1
          self.num = num // g
          self.den = den // g

      def as_tuple(self):
          return (self.num, self.den)

      def add(self, other):
          return Fraction(self.num * other.den + other.num * self.den, self.den * other.den)
