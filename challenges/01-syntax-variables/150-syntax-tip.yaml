id: syntax-tip
title: Tip Amount
topic: syntax-variables
tags:
  - syntax
  - math
difficulty: 2
order: 150
runner: pyodide
description: |
  ## Work out the tip

  Write a function `tip(bill, percent)` that returns the tip amount for a bill,
  rounded to 2 decimal places.

  For example, `tip(100, 15)` returns `15.0`.
starter_code: |
  def tip(bill, percent):
      pass
tests: |
  check(tip(100, 15) == 15.0, "15% of 100")
  check(tip(50, 20) == 10.0, "20% of 50")
  check(tip(0, 10) == 0.0, "no bill")
hints:
  - The tip is `bill * percent / 100`.
  - Round the result to 2 decimal places.
solution: |
  def tip(bill, percent):
      return round(bill * percent / 100, 2)
