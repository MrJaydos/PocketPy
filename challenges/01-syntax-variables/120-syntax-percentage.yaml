difficulty: 2
order: 120
runner: pyodide
description: |
  ## What percent?

  Write a function `percent(part, whole)` that returns what percentage `part` is
  of `whole`, rounded to 1 decimal place.

  For example, `percent(1, 4)` returns `25.0`.
starter_code: |
  def percent(part, whole):
      pass
tests: |
  check(percent(1, 4) == 25.0, "1 of 4 is 25%")
  check(percent(1, 3) == 33.3, "rounds to one decimal")
  check(percent(0, 5) == 0.0, "zero part")
hints:
  - Divide `part` by `whole`, then multiply by 100.
  - Round the final answer with `round(value, 1)`.
solution: |
  def percent(part, whole):
      return round(part / whole * 100, 1)
