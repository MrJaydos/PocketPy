runner: pyodide
description: |
  ## Compute a BMI

  Write a function `bmi(weight_kg, height_m)` that returns the body mass index —
  weight divided by height squared — rounded to 1 decimal place.

  For example, `bmi(70, 1.75)` returns `22.9`.
starter_code: |
  def bmi(weight_kg, height_m):
      pass
tests: |
  check(bmi(70, 1.75) == 22.9, "typical value")
  check(bmi(50, 2.0) == 12.5, "tall and light")
hints:
  - Divide the weight by the height raised to the power 2 (`height_m ** 2`).
  - Round to one decimal place.
solution: |
  def bmi(weight_kg, height_m):
      return round(weight_kg / (height_m ** 2), 1)
