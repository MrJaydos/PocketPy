difficulty: 3
order: 70
runner: pyodide
description: |
  ## The classic, as a list

  Write a function `fizzbuzz_list(n)` that returns a list for the numbers 1 to `n`:
  `"Fizz"` for multiples of 3, `"Buzz"` for multiples of 5, `"FizzBuzz"` for
  multiples of both, otherwise the number as a string.

  For example, `fizzbuzz_list(5)` returns `["1", "2", "Fizz", "4", "Buzz"]`.
starter_code: |
  def fizzbuzz_list(n):
      pass
tests: |
  check(fizzbuzz_list(5) == ["1", "2", "Fizz", "4", "Buzz"], "up to 5")
  check(fizzbuzz_list(3) == ["1", "2", "Fizz"], "up to 3")
  check(fizzbuzz_list(15)[-1] == "FizzBuzz", "15 is FizzBuzz")
hints:
  - Check the "both" case (divisible by 15) first.
  - Otherwise check 3, then 5, then fall back to `str(i)`.
solution: |
  def fizzbuzz_list(n):
      result = []
      for i in range(1, n + 1):
          if i % 15 == 0:
              result.append("FizzBuzz")
          elif i % 3 == 0:
              result.append("Fizz")
          elif i % 5 == 0:
              result.append("Buzz")
          else:
              result.append(str(i))
      return result
