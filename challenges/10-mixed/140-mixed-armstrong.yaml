runner: pyodide
description: |
  ## Narcissistic numbers

  Write a function `is_armstrong(n)` that returns `True` if `n` equals the sum of
  its own digits each raised to the power of the number of digits.

  For example, `153` is an Armstrong number because `1**3 + 5**3 + 3**3 == 153`.
starter_code: |
  def is_armstrong(n):
      pass
tests: |
  check(is_armstrong(153) == True, "153 is Armstrong")
  check(is_armstrong(9474) == True, "a four-digit one")
  check(is_armstrong(10) == False, "10 is not")
  check(is_armstrong(0) == True, "single digit")
hints:
  - Turn the number into a string to get its digits and their count.
  - Raise each digit to the power of the digit count and sum them.
solution: |
  def is_armstrong(n):
      digits = str(n)
      power = len(digits)
      total = sum(int(d) ** power for d in digits)
      return total == n
