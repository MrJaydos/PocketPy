description: |
  ## Add up the primes

  Write a function `sum_of_primes(n)` that returns the sum of all prime numbers
  less than or equal to `n`.

  For example, `sum_of_primes(10)` returns `17` (2 + 3 + 5 + 7).
starter_code: |
  def sum_of_primes(n):
      pass
tests: |
  check(sum_of_primes(10) == 17, "primes up to 10")
  check(sum_of_primes(2) == 2, "just 2")
  check(sum_of_primes(1) == 0, "no primes")
hints:
  - Write an `is_prime` helper and add up the primes from 2 to `n`.
solution: |
  def sum_of_primes(n):
      def is_prime(x):
          if x < 2:
              return False
          for d in range(2, int(x ** 0.5) + 1):
              if x % d == 0:
                  return False
          return True
      return sum(x for x in range(2, n + 1) if is_prime(x))
