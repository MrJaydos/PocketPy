description: |
  ## The Fibonacci sequence

  Each Fibonacci number is the sum of the two before it, starting `0, 1, 1, 2,
  3, 5, 8, ...`

  Write a function `fib(n)` that returns the `n`-th Fibonacci number, counting
  from 0. So `fib(0)` is `0`, `fib(1)` is `1`, and `fib(6)` is `8`.
starter_code: |
  def fib(n):
      # Return the n-th Fibonacci number (fib(0) = 0, fib(1) = 1).
      pass
tests: |
  check(fib(0) == 0, "fib(0) is 0")
  check(fib(1) == 1, "fib(1) is 1")
  check(fib(2) == 1, "fib(2) is 1")
  check(fib(6) == 8, "fib(6) is 8")
  check(fib(10) == 55, "fib(10) is 55")
hints:
  - Keep track of the last two values; start them at 0 and 1.
  - Each step, the new value is their sum, then slide the pair forward.
solution: |
  def fib(n):
      a, b = 0, 1
      for _ in range(n):
          a, b = b, a + b
      return a
