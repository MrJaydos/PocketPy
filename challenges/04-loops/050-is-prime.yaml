description: |
  ## Testing for a prime

  Write a function `is_prime(n)` that returns `True` if `n` is a prime number
  and `False` otherwise.

  A prime is a whole number greater than 1 with no divisors other than 1 and
  itself. So 2, 3, 5, 7 are prime; 1, 4, 9 are not.
starter_code: |
  def is_prime(n):
      # Return True if n is prime.
      pass
tests: |
  check(is_prime(2) is True, "2 is prime")
  check(is_prime(3) is True, "3 is prime")
  check(is_prime(4) is False, "4 = 2 x 2")
  check(is_prime(1) is False, "1 is not prime")
  check(is_prime(17) is True, "17 is prime")
  check(is_prime(15) is False, "15 = 3 x 5")
hints:
  - Numbers less than 2 are never prime — handle that first.
  - Check each candidate divisor from 2 up to n-1; if any divides n evenly, it's not prime.
solution: |
  def is_prime(n):
      if n < 2:
          return False
      for d in range(2, n):
          if n % d == 0:
              return False
      return True
