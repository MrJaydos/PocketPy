id: loops-sum-evens
title: Sum the Evens
topic: loops
tags:
  - loops
difficulty: 2
order: 130
runner: pyodide
description: |
  ## Evens up to n

  Write a function `sum_evens(n)` that returns the sum of all even numbers from 1
  to `n` inclusive.

  For example, `sum_evens(10)` returns `30`.
starter_code: |
  def sum_evens(n):
      pass
tests: |
  check(sum_evens(10) == 30, "2+4+6+8+10")
  check(sum_evens(5) == 6, "2+4")
  check(sum_evens(1) == 0, "no evens yet")
hints:
  - Loop from 1 to `n` and add the number when it's even.
solution: |
  def sum_evens(n):
      total = 0
      for i in range(1, n + 1):
          if i % 2 == 0:
              total += i
      return total
