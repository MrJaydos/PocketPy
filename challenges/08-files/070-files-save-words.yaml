id: files-save-words
title: Save Words to Lines
topic: files
tags:
  - files
  - strings
difficulty: 2
order: 70
runner: pyodide
description: |
  ## One word per line

  Write a function `save_words(sentence)` that writes each word of a sentence to a
  file on its own line, then reads them back and returns them as a list.

  For example, `save_words("the cat sat")` returns `["the", "cat", "sat"]`.
starter_code: |
  def save_words(sentence):
      pass
tests: |
  check(save_words("the cat sat") == ["the", "cat", "sat"], "three words")
  check(save_words("hi") == ["hi"], "one word")
  check(save_words("") == [], "no words")
hints:
  - "`sentence.split()` gives the words."
  - Read the file back line by line, stripping the trailing newline.
solution: |
  def save_words(sentence):
      words = sentence.split()
      with open("files-save-words.txt", "w") as f:
          for w in words:
              f.write(w + "\n")
      with open("files-save-words.txt") as f:
          return [line.rstrip("\n") for line in f]
