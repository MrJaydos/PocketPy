id: files-reverse-lines
title: Reverse the Lines
topic: files
tags:
  - files
difficulty: 3
order: 110
runner: pyodide
description: |
  ## Last line first

  Write a function `reverse_lines(lines)` that writes each string in `lines` to a
  file (one per line), then reads them back and returns the lines in reverse order
  as a list.

  For example, `reverse_lines(["a", "b", "c"])` returns `["c", "b", "a"]`.
starter_code: |
  def reverse_lines(lines):
      pass
tests: |
  check(reverse_lines(["a", "b", "c"]) == ["c", "b", "a"], "reversed")
  check(reverse_lines([]) == [], "empty input")
  check(reverse_lines(["x"]) == ["x"], "single line")
hints:
  - Read the file into a list, stripping the newlines.
  - Reverse it with slicing `[::-1]`.
solution: |
  def reverse_lines(lines):
      with open("files-reverse-lines.txt", "w") as f:
          for line in lines:
              f.write(line + "\n")
      with open("files-reverse-lines.txt") as f:
          read = [line.rstrip("\n") for line in f]
      return read[::-1]
