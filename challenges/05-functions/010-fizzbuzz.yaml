id: functions-fizzbuzz
title: FizzBuzz List
topic: functions
tags: [functions, loops, modulo]
difficulty: 3
order: 10
runner: pyodide
description: |
  ## Putting it together

  Write a function `fizzbuzz(n)` that returns a **list** of length `n`. For each
  number from `1` to `n`:

  - if it's divisible by both 3 and 5, use the string `"FizzBuzz"`
  - if it's divisible by 3, use `"Fizz"`
  - if it's divisible by 5, use `"Buzz"`
  - otherwise, use the number itself (as an `int`)

  For example, `fizzbuzz(5)` returns `[1, 2, "Fizz", 4, "Buzz"]`.
starter_code: |
  def fizzbuzz(n):
      # Build and return a list of length n.
      pass
tests: |
  check(fizzbuzz(5) == [1, 2, "Fizz", 4, "Buzz"], "first five values")
  check(fizzbuzz(3) == [1, 2, "Fizz"], "stops at n")
  check(fizzbuzz(15)[-1] == "FizzBuzz", "15 is FizzBuzz")
  check(len(fizzbuzz(10)) == 10, "length matches n")
hints:
  - Make an empty list, loop from 1 to n, and append the right value each time.
  - Check divisibility by 15 (or by 3 and 5 together) BEFORE checking 3 or 5 alone.
solution: |
  def fizzbuzz(n):
      result = []
      for i in range(1, n + 1):
          if i % 15 == 0:
              result.append("FizzBuzz")
          elif i % 3 == 0:
              result.append("Fizz")
          elif i % 5 == 0:
              result.append("Buzz")
          else:
              result.append(i)
      return result
