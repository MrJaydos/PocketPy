id: functions-make-adder
title: Make an Adder
topic: functions
tags: [functions, closures]
difficulty: 3
order: 40
runner: pyodide
description: |
  ## Returning a function

  A function can build and return another function. Write `make_adder(n)` that
  returns a **new function** which adds `n` to whatever it's given.

  For example:

  ```python
  add5 = make_adder(5)
  add5(3)   # -> 8
  add5(10)  # -> 15
  ```
starter_code: |
  def make_adder(n):
      # Return a function that adds n to its argument.
      pass
tests: |
  add5 = make_adder(5)
  check(add5(3) == 8, "add5(3) is 8")
  check(add5(10) == 15, "add5(10) is 15")
  add100 = make_adder(100)
  check(add100(1) == 101, "a separate adder works independently")
hints:
  - Define a function *inside* `make_adder` and `return` it (don't call it).
  - The inner function can use `n` from the outer function — that's a closure.
solution: |
  def make_adder(n):
      def adder(x):
          return x + n
      return adder
