id: lists-evens-only
title: Evens Only
topic: lists
tags:
  - lists
difficulty: 2
order: 130
runner: pyodide
description: |
  ## Keep the evens

  Write a function `evens(items)` that returns a new list with only the even
  numbers, in their original order.

  For example, `evens([1, 2, 3, 4])` returns `[2, 4]`.
starter_code: |
  def evens(items):
      pass
tests: |
  check(evens([1, 2, 3, 4]) == [2, 4], "keeps the evens")
  check(evens([1, 3, 5]) == [], "no evens")
  check(evens([]) == [], "empty list")
hints:
  - A list comprehension with an `if` filters nicely.
solution: |
  def evens(items):
      return [x for x in items if x % 2 == 0]
