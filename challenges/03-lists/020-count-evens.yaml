id: lists-count-evens
title: Count the Evens
topic: lists
tags: [lists, loops, modulo]
difficulty: 1
order: 20
runner: pyodide
description: |
  ## Counting items in a list

  Write a function `count_evens(numbers)` that returns how many numbers in the
  list are even.

  For example, `count_evens([1, 2, 3, 4])` is `2`.
starter_code: |
  def count_evens(numbers):
      # Count how many numbers are even.
      pass
tests: |
  check(count_evens([1, 2, 3, 4]) == 2, "2 and 4 are even")
  check(count_evens([1, 3, 5]) == 0, "no evens")
  check(count_evens([]) == 0, "empty list -> 0")
  check(count_evens([2, 4, 6, 8]) == 4, "all even")
hints:
  - Start a counter at 0 and loop over the list.
  - A number is even when `n % 2 == 0`.
solution: |
  def count_evens(numbers):
      count = 0
      for n in numbers:
          if n % 2 == 0:
              count += 1
      return count
