difficulty: 3
order: 200
runner: pyodide
description: |
  ## Cumulative sums

  Write a function `running(items)` that returns a list of cumulative sums: each
  element is the sum of all items up to and including that position.

  For example, `running([1, 2, 3])` returns `[1, 3, 6]`.
starter_code: |
  def running(items):
      pass
tests: |
  check(running([1, 2, 3]) == [1, 3, 6], "cumulative")
  check(running([]) == [], "empty list")
  check(running([5]) == [5], "single element")
hints:
  - Keep a running sum and append it after adding each item.
solution: |
  def running(items):
      result = []
      s = 0
      for x in items:
          s += x
          result.append(s)
      return result
