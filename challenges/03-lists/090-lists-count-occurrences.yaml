id: lists-count-occurrences
title: Count Occurrences
topic: lists
tags:
  - lists
  - loops
difficulty: 1
order: 90
runner: pyodide
description: |
  ## How many times?

  Write a function `count(items, target)` that returns how many times `target`
  appears in the list.

  For example, `count([1, 2, 2, 3], 2)` returns `2`.
starter_code: |
  def count(items, target):
      pass
tests: |
  check(count([1, 2, 2, 3], 2) == 2, "counts repeats")
  check(count([], 5) == 0, "empty list")
  check(count([1, 1, 1], 1) == 3, "all the same")
hints:
  - Loop through the list and add 1 whenever an item equals `target`.
solution: |
  def count(items, target):
      c = 0
      for x in items:
          if x == target:
              c += 1
      return c
